<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edge-glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background — Discord clips to circle, so rx barely matters -->
  <rect width="256" height="256" rx="24" fill="#0f1419"/>

  <!-- Edges -->
  <g stroke="#2a8a8a" fill="none" filter="url(#edge-glow)" stroke-linecap="round">
    <!-- Top bar -->
    <line x1="56" y1="64" x2="128" y2="50" stroke-width="2" opacity="0.7"/>
    <line x1="128" y1="50" x2="202" y2="60" stroke-width="2" opacity="0.7"/>
    <!-- Stem — slightly heavier for visual weight -->
    <line x1="128" y1="50" x2="133" y2="108" stroke-width="2.4" opacity="0.82"/>
    <line x1="133" y1="108" x2="130" y2="164" stroke-width="2.2" opacity="0.75"/>
    <line x1="130" y1="164" x2="131" y2="210" stroke-width="2" opacity="0.55"/>
    <!-- Ghost diagonals — implied triangle -->
    <line x1="56" y1="64" x2="133" y2="108" stroke-width="1.6" opacity="0.22"/>
    <line x1="202" y1="60" x2="133" y2="108" stroke-width="1.6" opacity="0.22"/>
    <!-- Asymmetric branches -->
    <line x1="130" y1="164" x2="80" y2="182" stroke-width="1.8" opacity="0.48"/>
    <line x1="133" y1="108" x2="184" y2="130" stroke-width="1.6" opacity="0.35"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <!-- Top bar -->
    <circle cx="56"  cy="64"  r="6"   fill="#d4952e"/>
    <circle cx="128" cy="50"  r="9"   fill="#ebb04a"/>
    <circle cx="202" cy="60"  r="6.5" fill="#e8a838"/>
    <!-- Stem -->
    <circle cx="133" cy="108" r="7.5" fill="#e8a838"/>
    <circle cx="130" cy="164" r="7"   fill="#ebb04a"/>
    <circle cx="131" cy="210" r="5.5" fill="#d4952e"/>
    <!-- Branch nodes -->
    <circle cx="80"  cy="182" r="5"   fill="#c8862a"/>
    <circle cx="184" cy="130" r="4.5" fill="#c8862a"/>
  </g>
</svg>
